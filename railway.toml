# Railway Configuration — Ngome Platform
# Using Nixpacks Node.js auto-detection with pre-compiled dist

[build]
  builder = "NIXPACKS"

[deploy]
  healthcheckPath = "/health"
  restartPolicyType = "always"
  startCommand = "cd src/backend && node src/database/migrations/prod-migrate.js && node dist/server.js"

[service]
  name = "ngome-backend"
