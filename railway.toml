# Railway Configuration — Ngome Platform
# Project: https://railway.app/project/fdf323a7-5500-4c0c-827f-504c680dfb44

[build]
  builder = "DOCKERFILE"

[deploy]
  # Using Dockerfile ENTRYPOINT (entrypoint.sh) which runs migrations then server
  healthcheckPath = "/health"
  restartPolicyType = "always"

[service]
  name = "ngome-backend"
