# Railway Configuration — CUT GRC Platform
# https://railway.app/project/fdf323a7-5500-4c0c-827f-504c680dfb44

[build]
  builder = "nixpacks"

[deploy]
  healthcheckPath = "/health"
  restartPolicyType = "always"

[service]
  name = "cut-grc-backend"
  repo = "Leano-Agent/cut-grc-platform"

[env]
  NODE_ENV = "production"
  CORS_ORIGINS = "https://cut-grc-frontend.vercel.app"
  # DATABASE_URL and JWT_SECRET automatically injected by Railway from PostgreSQL service
