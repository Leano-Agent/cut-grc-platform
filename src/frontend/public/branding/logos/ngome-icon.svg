<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3270" />
      <stop offset="100%" style="stop-color:#0D1A3E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017" />
      <stop offset="100%" style="stop-color:#A87C0A" />
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M0,16 L120,16 L120,100 Q120,152 60,170 Q0,152 0,100 Z"
        fill="url(#shieldGrad)"/>

  <!-- Gold border -->
  <path d="M5,21 L115,21 L115,99 Q115,147 60,163 Q5,147 5,99 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Battlements -->
  <rect x="5" y="6" width="18" height="16" rx="2" fill="#0D1A3E"/>
  <rect x="31" y="6" width="18" height="16" rx="2" fill="#0D1A3E"/>
  <rect x="57" y="6" width="18" height="16" rx="2" fill="#0D1A3E"/>
  <rect x="83" y="6" width="18" height="16" rx="2" fill="#0D1A3E"/>
  <rect x="97" y="6" width="18" height="16" rx="2" fill="#0D1A3E"/>
  <!-- Battlement base -->
  <rect x="0" y="20" width="120" height="9" fill="#0D1A3E"/>

  <!-- Ndebele terracotta band -->
  <rect x="5" y="64" width="110" height="18" fill="#C1440E" opacity="0.92"/>
  <polyline points="5,64 23,82 41,64 59,82 77,64 95,82 113,64"
            fill="none" stroke="#D4A017" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Central arched gate -->
  <rect x="46" y="96" width="28" height="40" fill="#D4A017" opacity="0.95"/>
  <path d="M46,96 Q60,76 74,96" fill="#D4A017" opacity="0.95"/>

  <!-- Flanking tower windows -->
  <rect x="10" y="92" width="22" height="30" rx="11" fill="#D4A017" opacity="0.75"/>
  <rect x="88" y="92" width="22" height="30" rx="11" fill="#D4A017" opacity="0.75"/>

  <!-- Shield bottom point accent -->
  <path d="M55,161 L60,170 L65,161 Z" fill="#D4A017" opacity="0.9"/>
</svg>
