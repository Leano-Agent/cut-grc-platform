<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <!-- All in single deep navy #1B2A5E -->

  <!-- Shield body -->
  <path d="M10,20 L90,20 L90,95 Q90,138 50,152 Q10,138 10,95 Z"
        fill="#1B2A5E"/>

  <!-- Inner border -->
  <path d="M14,24 L86,24 L86,94 Q86,133 50,146 Q14,133 14,94 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>

  <!-- Battlements -->
  <rect x="14" y="10" width="13" height="14" rx="1.5" fill="#0D1A3E"/>
  <rect x="33" y="10" width="13" height="14" rx="1.5" fill="#0D1A3E"/>
  <rect x="52" y="10" width="13" height="14" rx="1.5" fill="#0D1A3E"/>
  <rect x="71" y="10" width="13" height="14" rx="1.5" fill="#0D1A3E"/>
  <rect x="10" y="22" width="80" height="7" fill="#0D1A3E"/>

  <!-- Band -->
  <rect x="14" y="56" width="72" height="14" fill="#0D1A3E" opacity="0.5"/>
  <polyline points="14,56 26,70 38,56 50,70 62,56 74,70 86,56"
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linejoin="round"/>

  <!-- Gate -->
  <rect x="40" y="82" width="20" height="30" fill="#FFFFFF" opacity="0.8"/>
  <path d="M40,82 Q50,68 60,82" fill="#FFFFFF" opacity="0.8"/>

  <!-- Windows -->
  <rect x="18" y="80" width="14" height="20" rx="7" fill="#FFFFFF" opacity="0.6"/>
  <rect x="68" y="80" width="14" height="20" rx="7" fill="#FFFFFF" opacity="0.6"/>

  <!-- Bottom point -->
  <path d="M46,144 L50,152 L54,144 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- Wordmark -->
  <text x="108" y="100"
        font-family="'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-2"
        fill="#1B2A5E">Ngome</text>

  <!-- Rule -->
  <rect x="108" y="108" width="440" height="3.5" fill="#1B2A5E" opacity="0.45" rx="1.5"/>

  <!-- Tagline -->
  <text x="110" y="126"
        font-family="'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif"
        font-size="12.5"
        font-weight="500"
        letter-spacing="4"
        fill="#1B2A5E" opacity="0.65">THE FORTRESS FOR AFRICAN GOVERNANCE</text>

</svg>
