# Render BLUEPRINT Configuration
# CUT GRC Platform - Free Tier Deployment

services:
  - type: web
    name: ngome-free
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd src/backend && npm install --only=production
    startCommand: cd src/backend && node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "https://ngome-frontend.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /data/ngome.sqlite
