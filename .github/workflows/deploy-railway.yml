name: Deploy GRC to Railway

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to Railway
      uses: railwayapp/action@v1.2.2
      with:
        railway-token: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        service: cut-grc-backend
        environment: production

    - name: Verify
      run: |
        sleep 45
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cut-grc-backend-production.up.railway.app/health)
          echo "Health attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deploy complete!"
            exit 0
          fi
          sleep 15
        done
