name: Deploy to Railway (Direct)

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'cut-grc-backend'
        type: choice
        options:
        - cut-grc-backend
        - cut-grc-frontend
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to Railway
      uses: railwayapp/action@v1.2.2
      with:
        railway-token: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        service: ${{ github.event.inputs.service }}
        environment: ${{ github.event.inputs.environment }}

    - name: Wait and Verify
      run: |
        echo "Waiting for deploy..."
        sleep 60
        
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cut-grc-backend-production.up.railway.app/health)
          echo "Health attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            curl -s https://cut-grc-backend-production.up.railway.app/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Status: {d[\"status\"]} | Uptime: {round(d[\"uptime\"])}s | DB: {d[\"database\"]}')"
            echo "✅ Deploy successful!"
            exit 0
          fi
          sleep 15
        done
        echo "⚠️ Health check timed out"
        exit 1
