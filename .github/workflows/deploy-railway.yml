name: Deploy Ngome to Railway

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Railway Deploy
      run: |
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          "https://backboard.railway.app/graphql/v2" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"5e92d76a-eea5-4464-ad7c-fbfeccd1524f\", environmentId: \"0c05371d-c0c0-42b6-8e21-60f4e6c8bb95\") }"}')
        
        echo "Response: $RESPONSE"
        
        if echo "$RESPONSE" | grep -q "true"; then
          echo "✅ Redeploy triggered successfully!"
        else
          echo "⚠️ Unexpected response"
          exit 1
        fi

    - name: Wait and Verify
      run: |
        echo "Waiting for deploy..."
        sleep 60
        
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ngome-backend-production.up.railway.app/health)
          echo "Health attempt $i: HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            curl -s https://ngome-backend-production.up.railway.app/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Status: {d[\"status\"]} | Uptime: {round(d[\"uptime\"])}s | DB: {d[\"database\"]}')"
            echo "✅ Ngome backend is healthy!"
            exit 0
          fi
          sleep 15
        done
        echo "⚠️ Health check timed out"
        exit 1
