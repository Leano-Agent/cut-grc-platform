name: Test Railway Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Test Railway API connectivity
      run: |
        echo "=== Testing Railway API ==="
        
        # Test GraphQL API
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          "https://backboard.railway.app/graphql/v2" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"query":"{ me { email } }"}')
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -1)
        BODY=$(echo "$RESPONSE" | head -n -1)
        
        echo "GraphQL me query: HTTP $HTTP_CODE"
        echo "Body: $BODY"
        
        # If that works, try the deploy
        if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q "email"; then
          echo "✅ Token is valid!"
          
          echo "=== Triggering Deploy ==="
          RESPONSE2=$(curl -s -w "\n%{http_code}" -X POST \
            "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"5e92d76a-eea5-4464-ad7c-fbfeccd1524f\", environmentId: \"0c05371d-c0c0-42b6-8e21-60f4e6c8bb95\") }"}')
          
          echo "Deploy response: $RESPONSE2"
        else
          echo "❌ Token is INVALID or expired"
        fi
