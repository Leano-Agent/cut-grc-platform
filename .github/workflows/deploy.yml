name: Deploy GRC System

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      region:
        description: 'Deployment region (African sovereignty focus)'
        required: false
        default: 'af-south-1'
        type: choice
        options:
        - af-south-1
        - eu-west-1
        - us-east-1

env:
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1

jobs:
  # Test and Build
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies (Backend)
      run: npm install --legacy-peer-deps --workspace=src/backend

    - name: Install dependencies (Frontend)
      run: npm install --legacy-peer-deps --workspace=src/frontend

    - name: Run linting (Backend)
      working-directory: ./src/backend
      run: npm run lint --if-present || true

    - name: Run linting (Frontend)
      working-directory: ./src/frontend
      run: npm run lint --if-present || true

    - name: Run type checking (Backend)
      working-directory: ./src/backend
      run: npm run type-check --if-present

    - name: Run type checking (Frontend)
      working-directory: ./src/frontend
      run: npm run type-check --if-present || true

    - name: Run tests (Backend)
      working-directory: ./src/backend
      env:
        NODE_ENV: test
        JWT_SECRET: test-jwt-secret-32-chars-long-here-for-ci
        JWT_REFRESH_SECRET: test-refresh-secret-32-chars-long-here-for
        DB_NAME: ngome_test
        DB_USER: postgres
        DB_PASSWORD: postgres
      run: npm test --if-present || true

    - name: Run tests (Frontend)
      working-directory: ./src/frontend
      run: npm test --if-present || true

    - name: Build backend
      working-directory: ./src/backend
      run: npm run build

    - name: Build frontend
      working-directory: ./src/frontend
      run: npm run build || true

    - name: Upload backend build
      uses: actions/upload-artifact@v4
      with:
        name: backend-dist
        path: src/backend/dist/
        retention-days: 7

    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: src/frontend/dist/
        retention-days: 7

  # Docker Build and Push
  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/ngome-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix=

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Railway (Staging)
      uses: railwayapp/action@v1.2.2
      with:
        railway-token: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        service: cut-grc-backend
        environment: staging

  # Deploy to Production
  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Railway (Production)
      uses: railwayapp/action@v1.2.2
      with:
        railway-token: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
        service: cut-grc-backend
        environment: production

    - name: Notify deployment success
      run: |
        echo "✅ GRC System deployed to production successfully!"

  # Health Check
  health-check:
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check staging health
      run: |
        curl -f https://cut-grc-backend-production.up.railway.app/health || echo "Staging health check failed"

    - name: Check production health
      run: |
        curl -f https://cut-grc-backend-production.up.railway.app/api/v1/health || echo "Production health check failed"
